# ──────────────────────────────────────────────────────
#  Kitty — Catppuccin Mocha · Acrylic · Fish-tuned
#  Display: 2560×1440 · Shell: fish · GNOME (Wayland) dark
#  Requires kitty >= 0.43
# ──────────────────────────────────────────────────────

# ── Font ─────────────────────────────────────────────
font_family      Maple Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.5

# cell_height theo % -> độc lập DPI
modify_font      cell_height 115%

# Nerd Font icons (starship/lualine) render crisp dù primary font ko có glyph.
# Cần: `Symbols Nerd Font Mono` (gói ttf-nerd-fonts-symbols / nerdfonts.com)
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EBEB,U+EC00-U+EC1E,U+ED00-U+EFCE,U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# ── Legibility (kitty 0.40+) ─────────────────────────
# skip-ink: underline chừa khoảng ở descender (y,g,p,q) -> URL/diagnostic sạch
underline_exclusion 1
# undercurl LSP/spellcheck trong nvim: mảnh + thưa, đỡ rối mắt
undercurl_style thin-sparse
# nếu Maple Mono thấy hơi mảnh trên 1440p, thử mở dòng dưới (stroke dày hơn):
# text_composition_strategy legacy

# ── Cursor & Trail ───────────────────────────────────
cursor                  #f5e0dc
cursor_text_color       #1e1e2e
cursor_shape            beam
cursor_beam_thickness   1.8

# split ko focus -> con trỏ rỗng
cursor_shape_unfocused  hollow
cursor_blink_interval   -1
cursor_stop_blinking_after 0

# Trail: value = ms cursor đứng yên trước khi trail bật; decay = (fast, slow) giây
cursor_trail                 5
cursor_trail_decay           0.07 0.28
# 3 = chỉ trail khi nhảy xa, ko trail lúc gõ
cursor_trail_start_threshold 3
# cursor_trail_color         #b4befe

# ── Performance ──────────────────────────────────────
# repaint_delay 10ms = trần ~100Hz. 144Hz -> 7, 165Hz -> 6
repaint_delay    10
input_delay      1
sync_to_monitor  yes

# ── Acrylic = blur nền + noise grain ─────────────────
# LƯU Ý: background_opacity KHÔNG áp lên background_image.
# noise.png dùng alpha riêng + background_tint. Muốn grain rõ -> HẠ tint;
# quá hạt -> TĂNG tint.
background_opacity      0.5
background_blur         24
dynamic_background_opacity yes

background_image        noise.png
background_image_layout tiled
background_tint         0.93
background_tint_gaps    1.0

# ép contrast tối thiểu cho text khi nền trong (dễ đọc hơn ở opacity 0.5)
# về 0% nếu thấy màu bị đục
text_fg_override_threshold 12%

# ── Catppuccin Mocha ─────────────────────────────────
foreground  #cdd6f4
background  #1e1e2e

selection_foreground #1e1e2e
selection_background #f5e0dc

color0   #45475a
color1   #f38ba8
color2   #a6e3a1
color3   #f9e2af
color4   #89b4fa
color5   #f5c2e7
color6   #94e2d5
color7   #bac2de
color8   #585b70
color9   #f38ba8
color10  #a6e3a1
color11  #f9e2af
color12  #89b4fa
color13  #f5c2e7
color14  #94e2d5
color15  #cdd6f4

# Search / scrollback match highlight
mark1_foreground #11111b
mark1_background #fab387
mark2_foreground #11111b
mark2_background #a6e3a1
mark3_foreground #11111b
mark3_background #89dceb

# Dim split ko focus
inactive_text_alpha 0.7

# ── URL / Hyperlinks ─────────────────────────────────
url_color           #f5e0dc
url_style           straight
open_url_with       default
detect_urls         yes
# OSC-8 hyperlink (vd `ls --hyperlink`) chỉ gạch khi hover, đỡ noise
underline_hyperlinks hover
allow_hyperlinks     yes

# ── Window ───────────────────────────────────────────
window_padding_width        8 10
placement_strategy          center
confirm_os_window_close     0
window_resize_step_cells    2
window_resize_step_lines    2

hide_window_decorations     no
# GNOME/Wayland: titlebar CSD khớp nền terminal (X11 sẽ bỏ qua dòng này)
wayland_titlebar_color      background
window_border_width         1.0pt
active_border_color         #b4befe
inactive_border_color       #6c7086
bell_border_color           #f9e2af

# ── Tab Bar ──────────────────────────────────────────
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           center
# ẩn tab bar khi chỉ 1 tab
tab_bar_min_tabs        2
tab_bar_margin_width    0.0
tab_bar_margin_height   2.0 0.0
# đóng tab -> về tab vừa dùng
tab_switch_strategy     previous

tab_title_template      "{fmt.fg._cba6f7}{sup.index}{fmt.fg.tab} {title[:20]}{' [+'+str(num_windows-1)+']' if num_windows > 1 else ''} "
tab_activity_symbol     "•"

active_tab_foreground   #11111b
active_tab_background   #cba6f7
active_tab_font_style   bold
inactive_tab_foreground #6c7086
inactive_tab_background #181825
inactive_tab_font_style normal
tab_bar_background      #11111b

# ── Scrollback ───────────────────────────────────────
scrollback_lines        10000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 64
wheel_scroll_multiplier 5.0
wheel_scroll_min_lines  1
touch_scroll_multiplier 1.0

# ── Mouse ────────────────────────────────────────────
mouse_hide_wait         1.5
click_interval          0.5
focus_follows_mouse     no
pointer_shape_when_grabbed  arrow
default_pointer_shape       beam
pointer_shape_when_dragging beam

# ── Bell / Notifications ─────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell yes
# báo khi lệnh chạy >10s xong mà window đang KHÔNG nhìn thấy được
# (inactive tab / OS window khác). Cần shell_integration (fish có).
notify_on_cmd_finish invisible 10.0

# ── Layout ───────────────────────────────────────────
enabled_layouts tall,stack,fat,grid,horizontal,splits

# ── Fish Shell Integration & Remote Control ──────────
shell                   /usr/bin/fish
# '.' = dùng $EDITOR/$VISUAL (nvim)
editor                  .
close_on_child_death    no
shell_integration       enabled
term                    xterm-kitty
update_check_interval   0
startup_session         none

# shell_integration enabled -> fish có: prompt marks (scroll_to_prompt),
# command boundaries (show_last_command_output), OSC-7 cwd (*_with_cwd),
# clone-in-kitty, edit-in-kitty.

# socket-only an toàn hơn `yes`: chặn control qua ssh, mà `kitten @` local vẫn chạy
# (fish được export KITTY_LISTEN_ON nên `kitten @ ls` ko cần --to)
allow_remote_control    socket-only
listen_on               unix:/tmp/kitty

clipboard_control       write-clipboard write-primary read-clipboard-ask read-primary-ask
clipboard_max_size      512

# ── Keyboard Shortcuts ───────────────────────────────
kitty_mod ctrl+shift

# Tabs
map kitty_mod+t     new_tab_with_cwd
map kitty_mod+w     close_tab
map kitty_mod+right next_tab
map kitty_mod+left  previous_tab
map kitty_mod+period move_tab_forward
map kitty_mod+comma  move_tab_backward
map ctrl+alt+1      goto_tab 1
map ctrl+alt+2      goto_tab 2
map ctrl+alt+3      goto_tab 3
map ctrl+alt+4      goto_tab 4
map ctrl+alt+5      goto_tab 5

# Splits
map kitty_mod+enter new_window_with_cwd
map kitty_mod+d     launch --location=vsplit --cwd=current
map kitty_mod+minus launch --location=hsplit --cwd=current
map kitty_mod+h     neighboring_window left
map kitty_mod+l     neighboring_window right
map kitty_mod+k     neighboring_window up
map kitty_mod+j     neighboring_window down
map kitty_mod+r     start_resizing_window
# zoom pane (toggle stack)
map kitty_mod+z     toggle_layout stack
map kitty_mod+bracketleft  move_window_backward
map kitty_mod+bracketright move_window_forward
# clone window giữ nguyên env của fish (PATH, venv, mise) + cwd
map kitty_mod+n     launch --cwd=current --copy-env

# Fish prompt navigation (cần prompt marks từ shell_integration)
# nhảy giữa các prompt thay vì cuộn từng dòng
map ctrl+shift+up   scroll_to_prompt -1
map ctrl+shift+down scroll_to_prompt 1

# Font size
map kitty_mod+equal  change_font_size all +0.5
map kitty_mod+0      change_font_size all 0

# Opacity (acrylic strength)
map kitty_mod+a>m   set_background_opacity +0.05
map kitty_mod+a>l   set_background_opacity -0.05
map kitty_mod+a>1   set_background_opacity 1.0
map kitty_mod+a>d   set_background_opacity default

# Config
map kitty_mod+f5    load_config_file
map kitty_mod+f2    edit_config_file
map kitty_mod+delete clear_terminal reset active

# Cheatsheet overlay
map kitty_mod+slash launch --type=overlay --title="  Shortcuts" sh -c "cat ~/.config/kitty/shortcuts.txt | less -R; true"

# Scrollback, command output & hints
map kitty_mod+f     show_scrollback
map kitty_mod+g     show_last_command_output
map kitty_mod+c     copy_to_clipboard
map kitty_mod+v     paste_from_clipboard
map kitty_mod+s     paste_from_selection
map kitty_mod+u     kitten unicode_input
map kitty_mod+p>f   kitten hints --type path --program -
map kitty_mod+p>l   kitten hints --type line --program -
map kitty_mod+p>u   kitten hints --type url
map kitty_mod+p>h   kitten hints --type hyperlink
