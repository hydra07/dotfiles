[tools]
node = "22"
go = "1.25"
pnpm = "10"
bun = "1.2"
zig = "0.14"
jq = "latest"
just = "latest"
lua = "5.4"
uv = "latest"
"npm:@typescript/native-preview" = "7.0.0-dev.20260707.2"

[env]
GOPATH = "{{ env.HOME }}/.local/share/go"
GOBIN = "{{ env.HOME }}/.local/bin"
PNPM_HOME = "{{ env.HOME }}/.local/share/pnpm"
_.path = ["{{ env.HOME }}/.local/share/pnpm"]

[settings]
lockfile = true
jobs = 5
# experimental: off
idiomatic_version_file_enable_tools = ["node"]

[settings.python]
uv_venv_auto = "create|source"
